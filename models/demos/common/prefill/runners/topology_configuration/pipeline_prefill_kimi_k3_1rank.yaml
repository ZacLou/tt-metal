# Kimi-K3 SMOKE TEST, 1 rank, 48 layers (AttnRes blocks 0-3). Single-rank first because a 2-rank
# failure is far harder to attribute, and this exercises everything except the cross-rank sealed-set
# handoff. Drive with prefill_producer.py on this host.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto
global_env:
  # FABRIC_2D, never a torus: `attn_res_gather_softmax` deadlocks under Topology::Ring
  # (tenstorrent/tt-metal#54835), so every AttnRes read would hang on a wrapped axis.
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi_k3.json"
  PREFILL_MODEL: "kimi_k3"
  # 48 = four complete 12-layer AttnRes blocks. A split inside a block would leave a rank whose
  # sealed set is incomplete.
  PREFILL_NUM_LAYERS: "48"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  # L1_SMALL is not an env knob: the runner reads ADAPTER.l1_small_size, set to 4096 there.
  PREFILL_LAYER_ACK_D2H: "1"
  PREFILL_ENABLE_LAYER_ACK: "1"
  LOGURU_LEVEL: "INFO"
